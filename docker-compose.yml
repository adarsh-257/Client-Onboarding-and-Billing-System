services:
  # ---------- PostgreSQL ----------
  postgres:
    image: postgres:16-alpine
    container_name: onboarding_postgres
    environment:
      POSTGRES_DB: onboarding_db
      POSTGRES_USER: onboarding_user
      POSTGRES_PASSWORD: onboarding_pass
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U onboarding_user -d onboarding_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---------- Zookeeper (Kafka dependency) ----------
  zookeeper:
    image: confluentinc/cp-zookeeper:7.7.1
    container_name: onboarding_zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
    healthcheck:
      test: ["CMD", "bash", "-c", "echo ruok | nc localhost 2181"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---------- Apache Kafka ----------
  kafka:
    image: confluentinc/cp-kafka:7.7.1
    container_name: onboarding_kafka
    depends_on:
      zookeeper:
        condition: service_healthy
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,PLAINTEXT_INTERNAL://kafka:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_INTERNAL:PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    ports:
      - "9092:9092"
    healthcheck:
      test: ["CMD", "kafka-topics", "--bootstrap-server", "localhost:9092", "--list"]
      interval: 15s
      timeout: 10s
      retries: 10

  # ---------- Kafka UI (Optional - for monitoring) ----------
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: onboarding_kafka_ui
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      KAFKA_CLUSTERS_0_NAME: onboarding-cluster
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
      KAFKA_CLUSTERS_0_ZOOKEEPER: zookeeper:2181
    ports:
      - "8080:8080"

  # ---------- Web App ----------
  web:
    build: .
    container_name: onboarding_web
    ports:
      - "5000:5000"
    environment:
      - DATABASE_URL=postgresql://onboarding_user:onboarding_pass@postgres:5432/onboarding_db
      - KAFKA_BOOTSTRAP_SERVERS=kafka:29092
      - FLASK_ENV=production
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy

  # ---------- Kafka Consumer Worker ----------
  worker:
    build: .
    container_name: onboarding_worker
    command: ["python", "-m", "app.kafka.consumer"]
    environment:
      - DATABASE_URL=postgresql://onboarding_user:onboarding_pass@postgres:5432/onboarding_db
      - KAFKA_BOOTSTRAP_SERVERS=kafka:29092
      - FLASK_ENV=production
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy

volumes:
  postgres_data:
