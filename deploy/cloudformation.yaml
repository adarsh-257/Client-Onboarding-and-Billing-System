AWSTemplateFormatVersion: '2010-09-09'
Description: 'Client Onboarding System - Docker Deployment Stack'

Parameters:
  InstanceType:
    Type: String
    Default: t3.small
    AllowedValues: [t2.micro, t3.micro, t3.small, t3.medium]
    Description: 'EC2 Instance Type. Note: Kafka + Postgres + Flask requires 2GB RAM. t3.small is recommended.'
  
  CodeS3Bucket:
    Type: String
    Description: 'S3 bucket containing the source code zip'
  
  CodeS3Key:
    Type: String
    Description: 'S3 object key for the source code zip'

Resources:
  # IAM Role allowing the instance to download the zip from S3
  InstanceRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: S3DownloadAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:ListBucket
                Resource:
                  - !Sub 'arn:aws:s3:::${CodeS3Bucket}'
                  - !Sub 'arn:aws:s3:::${CodeS3Bucket}/*'

  InstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles:
        - !Ref InstanceRole

  # Security Group allowing HTTP, HTTPS, SSH, and Flask 5000
  InstanceSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Enable HTTP/HTTPS/SSH and 5000
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 22
          ToPort: 22
          CidrIp: 0.0.0.0/0
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: 0.0.0.0/0
        - IpProtocol: tcp
          FromPort: 5000
          ToPort: 5000
          CidrIp: 0.0.0.0/0

  # EC2 Instance running Docker
  AppServer:
    Type: AWS::EC2::Instance
    Properties:
      InstanceType: !Ref InstanceType
      ImageId: resolve:ssm:/aws/service/ami-amazon-linux-latest/al2023-ami-kernel-6.1-x86_64
      IamInstanceProfile: !Ref InstanceProfile
      SecurityGroupIds:
        - !GetAtt InstanceSecurityGroup.GroupId
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          set -e

          # 1. Setup 2GB Swap Memory (Crucial for Kafka on small instances)
          dd if=/dev/zero of=/swapfile bs=1M count=2048
          chmod 600 /swapfile
          mkswap /swapfile
          swapon /swapfile
          echo "/swapfile swap swap defaults 0 0" >> /etc/fstab

          # 2. Install Docker and Docker Compose
          dnf update -y
          dnf install -y docker unzip wget
          systemctl enable docker
          systemctl start docker
          
          # Install Docker Compose Plugin
          mkdir -p /usr/local/lib/docker/cli-plugins
          wget -qO /usr/local/lib/docker/cli-plugins/docker-compose https://github.com/docker/compose/releases/download/v2.24.5/docker-compose-linux-x86_64
          chmod +x /usr/local/lib/docker/cli-plugins/docker-compose
          ln -s /usr/local/lib/docker/cli-plugins/docker-compose /usr/bin/docker-compose

          # 3. Download Source Code
          mkdir -p /app
          cd /app
          aws s3 cp s3://${CodeS3Bucket}/${CodeS3Key} source.zip
          unzip source.zip
          rm source.zip

          # 4. Bootstrap Application (Seed and Run)
          cp .env.example .env
          
          # Optional: Expose the Flask app fully
          echo "FLASK_ENV=production" >> .env
          echo "DOCKER_HOST_IP=$(curl -s http://169.254.169.254/latest/meta-data/public-ipv4)" >> .env

          # Start Docker Compose Stack
          docker-compose up --build -d

          # Wait for PostgreSQL to be healthy
          sleep 45

          # Seed the Database
          docker-compose exec -T web bash -c "echo 'y' | python scripts/seed_data.py"

Outputs:
  InstancePublicIP:
    Description: Public IP of the Application Server
    Value: !GetAtt AppServer.PublicIp
  AppURL:
    Description: URL to access the deployed web application
    Value: !Sub 'http://${AppServer.PublicIp}:5000'
